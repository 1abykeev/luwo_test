services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: luwo
      POSTGRES_PASSWORD: luwo
      POSTGRES_DB: luwo
    ports:
      # 5433 on the host: 5432 is often taken by a local Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luwo -d luwo"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Optional dashboard:  docker compose --profile observability up -d
  # Prometheus scrapes the backend on your machine; Grafana shows it at http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach the backend on Linux too

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # anyone can look at the dashboard without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin  # to edit: log in as admin / admin (local demo only)
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
