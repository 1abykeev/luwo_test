services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: luwo
      POSTGRES_PASSWORD: luwo
      POSTGRES_DB: luwo
    ports:
      # 5433 on the host: 5432 is often taken by a local Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luwo -d luwo"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
